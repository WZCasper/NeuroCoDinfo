name: Диагностика сети (временный файл)

# Этот workflow не часть обычной работы сайта — он нужен один раз, чтобы
# проверить гипотезу: блокирует ли callofduty.com трафик именно с
# инфраструктуры GitHub Actions (Azure), или причина в чём-то другом.
#
# Запускать только вручную: вкладка Actions -> "Диагностика сети
# (временный файл)" -> Run workflow. После того как причина станет понятна,
# этот файл можно (и нужно) удалить — он не нужен для работы сайта.
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Какой IP-адрес и ASN у этого раннера
        run: |
          echo "--- Исходящий IP-адрес раннера и его провайдер ---"
          curl -s https://ipinfo.io/json || echo "ipinfo.io недоступен"

      - name: Запрос к callofduty.com с подробным выводом (curl по умолчанию)
        # --max-time 15: не ждать долго, если сайт действительно зависает —
        # нам нужен факт, а не повторение 5-минутного ожидания.
        # -v: подробный вывод — покажет, на каком именно этапе что идёт не так
        #     (DNS, TCP-соединение, TLS handshake, ожидание заголовков ответа).
        # -o /dev/null: тело ответа не нужно, нас интересует код и тайминг.
        # -w: выводит точные тайминги каждого этапа запроса отдельно.
        # || true: чтобы шаг не прерывал workflow, если curl вернёт ошибку —
        #          нам нужно увидеть вывод, а не остановиться на первом сбое.
        run: |
          echo "--- Запрос с обычным curl User-Agent ---"
          curl -v --max-time 15 -o /dev/null \
            -w "\n\nHTTP-код: %{http_code}\nВремя до соединения: %{time_connect}s\nВремя до TLS: %{time_appconnect}s\nВремя до первого байта ответа: %{time_starttransfer}s\nОбщее время: %{time_total}s\n" \
            https://www.callofduty.com/blog || echo "curl завершился с ошибкой (это тоже важный результат, не сбой диагностики)"

      - name: Тот же запрос, но с нашим ботовским User-Agent
        # Сравниваем с предыдущим шагом: если здесь результат хуже, чем с
        # обычным curl User-Agent — значит дело именно в том, как сайт
        # распознаёт представившегося ботом клиента, а не только в ASN.
        run: |
          echo "--- Запрос с нашим User-Agent бота ---"
          curl -v --max-time 15 -o /dev/null \
            -H "User-Agent: NeuroCoDinfoBot/1.0 (+https://github.com/; news aggregator and translator bot)" \
            -w "\n\nHTTP-код: %{http_code}\nВремя до соединения: %{time_connect}s\nВремя до TLS: %{time_appconnect}s\nВремя до первого байта ответа: %{time_starttransfer}s\nОбщее время: %{time_total}s\n" \
            https://www.callofduty.com/blog || echo "curl завершился с ошибкой (это тоже важный результат, не сбой диагностики)"

      - name: Для сравнения — запрос к сайту, который точно не блокирует облака
        # Контрольная проверка: если и этот запрос тоже зависает — значит
        # дело не в callofduty.com конкретно, а в чём-то более общем с самой
        # сетью раннера (что было бы неожиданно, но его тоже нужно исключить).
        run: |
          echo "--- Контрольный запрос к example.com ---"
          curl -v --max-time 15 -o /dev/null \
            -w "\n\nHTTP-код: %{http_code}\nОбщее время: %{time_total}s\n" \
            https://example.com || echo "curl завершился с ошибкой"
